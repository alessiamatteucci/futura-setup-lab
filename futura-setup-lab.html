</script>
<script type="module">
/* ============================================================
   SCENA 3D DELLA HOME — il sigillo Futura estruso.
   Le stelline aprono i due gruppi di sezioni (vedi STAR_LINKS).
   ============================================================ */
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const FRAME = {"cx": 1882.0, "cy": 1876.0, "outerR": 1830};
const PINK = 0xffafd6, MINT = 0x95f7ce;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
// stellina a sinistra → Percorsi guidati · in alto a destra → Repository e consultazione · in basso a destra → Mondo Figma
const STAR_LINKS = { left: "g-percorsi", upperRight: "g-consultazione", lowerRight: "g-figma" };

const canvas = document.getElementById("stage");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { document.body.classList.add("no-webgl"); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0, 10);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 4, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x95f7ce, 0.9); rim.position.set(-5, -2, -3); scene.add(rim);
const fill = new THREE.PointLight(0xffafd6, 6, 30); fill.position.set(-3, 2, 4); scene.add(fill);

const R = 2.6, k = R / FRAME.outerR;
function extrudeShapes(shapes, depth, bevel, seg) {
  const g = new THREE.ExtrudeGeometry(shapes, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 4, curveSegments: seg });
  g.translate(-FRAME.cx, -FRAME.cy, -depth / 2); g.scale(k, -k, -k); g.computeVertexNormals(); return g;
}
const shapesOf = id => { const out = []; new SVGLoader().parse(document.getElementById(id).textContent).paths.forEach(p => SVGLoader.createShapes(p).forEach(s => out.push(s))); return out; };
const plastic = new THREE.MeshPhysicalMaterial({ color: PINK, roughness: 0.28, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 0.9 });

const root = new THREE.Group(); scene.add(root);
const inner = new THREE.Group(); root.add(inner);
inner.add(new THREE.Mesh(extrudeShapes(shapesOf("svg-inner"), 70, 10, 6), plastic));
const gimbal = new THREE.Group(); root.add(gimbal); gimbal.rotation.z = THREE.MathUtils.degToRad(-12);
const ring = new THREE.Group(); gimbal.add(ring);
ring.add(new THREE.Mesh(extrudeShapes(shapesOf("svg-outer"), 44, 6, 4), plastic));

const glowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d"); const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(149,247,206,0.95)"); gr.addColorStop(0.35, "rgba(149,247,206,0.35)"); gr.addColorStop(1, "rgba(149,247,206,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const stars = [];
shapesOf("svg-stars").forEach(shape => {
  const g = extrudeShapes([shape], 90, 12, 8); g.computeBoundingBox();
  const c = new THREE.Vector3(); g.boundingBox.getCenter(c); g.translate(-c.x, -c.y, -c.z);
  const mat = new THREE.MeshPhysicalMaterial({ color: MINT, emissive: MINT, emissiveIntensity: 0.6, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 });
  const holder = new THREE.Group(); holder.position.copy(c); inner.add(holder);
  const mesh = new THREE.Mesh(g, mat); holder.add(mesh);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.scale.setScalar(0.9); glow.position.z = -0.02; holder.add(glow);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), new THREE.MeshBasicMaterial({ visible: false })); holder.add(hit);
  stars.push({ holder, mesh, glow, mat, hit, phase: stars.length * 2.1, s: 1, link: null, c });
});
// assegna i collegamenti in base alla posizione delle stelline nel logo
const byX = [...stars].sort((a, b) => a.c.x - b.c.x);
byX[0].link = STAR_LINKS.left;
const rest = byX.slice(1).sort((a, b) => b.c.y - a.c.y);
if (rest[0]) rest[0].link = STAR_LINKS.upperRight;
if (rest[1]) rest[1].link = STAR_LINKS.lowerRight;

/* ---------- etichette delle stelline ---------- */
const tagLayer = document.getElementById("star-tags");
const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
function tagHTML(link) {
  const info = (window.__groupInfo || {})[link] || { title: link, sub: "" };
  return `<span class="st-line" aria-hidden="true"></span><span class="st-card"><span class="st-title">${info.title}</span><span class="st-sub">${info.sub}</span><span class="st-go">Apri ${ARROW}</span></span>`;
}
stars.filter(s => s.link).forEach(s => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "star-tag"; b.dataset.link = s.link; b.innerHTML = tagHTML(s.link);
  b.addEventListener("click", () => window.__openGroup && window.__openGroup(s.link));
  b.addEventListener("pointerenter", () => { s.tagHover = true; });
  b.addEventListener("pointerleave", () => { s.tagHover = false; s.until = performance.now() + 450; });
  b.addEventListener("focus", () => { s.tagHover = true; });
  b.addEventListener("blur", () => { s.tagHover = false; });
  tagLayer.appendChild(b); s.tag = b;
});
window.addEventListener("labels-change", () => stars.forEach(s => { if (s.tag) s.tag.innerHTML = tagHTML(s.link); }));

/* ---------- interazione ---------- */
const pointer = new THREE.Vector2(9, 9), ray = new THREE.Raycaster();
let hovered = null, dragging = false, moved = 0, last = null, vel = { x: 0, y: 0 }, tilt = { x: 0, y: 0 };
let drawer = { open: false, edge: 0 };
window.addEventListener("drawer-change", e => { drawer = e.detail; });
function toNdc(e) { const r = canvas.getBoundingClientRect(); pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }
canvas.addEventListener("pointermove", e => {
  toNdc(e);
  if (dragging && last) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; moved += Math.abs(dx) + Math.abs(dy);
    tilt.y += dx * 0.008; tilt.x += dy * 0.008; vel = { x: dy * 0.008, y: dx * 0.008 };
  }
});
canvas.addEventListener("pointerdown", e => { endHint(); toNdc(e); dragging = true; moved = 0; last = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); canvas.classList.add("dragging"); });
canvas.addEventListener("pointerup", e => {
  const click = moved < 6; dragging = false; last = null; canvas.classList.remove("dragging");
  if (!click) return;
  toNdc(e); ray.setFromCamera(pointer, camera);
  const h = ray.intersectObjects(stars.map(s => s.hit), false)[0];
  const s = h && stars.find(x => x.hit === h.object);
  if (s && s.link) {
    if (e.pointerType === "touch" && !s.pinned) { stars.forEach(o => o.pinned = false); s.pinned = true; }   // al primo tocco mostra l'etichetta
    else window.__openGroup && window.__openGroup(s.link);
  } else stars.forEach(o => o.pinned = false);
});
canvas.addEventListener("pointercancel", () => { dragging = false; last = null; canvas.classList.remove("dragging"); });
canvas.addEventListener("pointerleave", () => pointer.set(9, 9));

function viewSize() {
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  return { w: h * camera.aspect, h };
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const fit = (R * 1.42) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.z = w < h ? fit / camera.aspect : fit;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock(), tmp = new THREE.Vector3();
const INTRO_DUR = 2.4;
const HINT_FROM = INTRO_DUR - 0.2, HINT_FOR = 9;      // compare a fine giro e lampeggia per circa 9 secondi
const hintEl = document.getElementById("logo-hint");
const touch = matchMedia("(pointer: coarse)").matches;
hintEl.innerHTML = touch
  ? "<b>Trascina</b> per ruotare<br><b>Tocca le stelline</b><br>per aprire le sezioni"
  : "<b>Trascina</b> per ruotare<br><b>Clicca le stelline</b><br>per aprire le sezioni";
let hintDone = false;
const endHint = () => { if (!hintDone) { hintDone = true; hintEl.classList.remove("on"); } };
let baseY = 0;
let spin = !reduce;
window.addEventListener("spin-change", e => { spin = e.detail; });
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (spin) ring.rotation.y += dt * 0.55;
  if (!dragging) {
    tilt.x += vel.x; tilt.y += vel.y; vel.x *= 0.92; vel.y *= 0.92;
    const front = Math.round(tilt.y / (Math.PI * 2)) * Math.PI * 2;
    tilt.x *= 0.95; tilt.y += (front - tilt.y) * 0.035;
  }
  const follow = !dragging && pointer.x < 5 && !drawer.open ? 1 : 0;
  root.rotation.x += ((tilt.x - pointer.y * 0.12 * follow) - root.rotation.x) * 0.08;
  baseY += ((tilt.y + pointer.x * 0.18 * follow) - baseY) * 0.08;
  // all'apertura il medaglione fa un giro completo su se stesso e si ferma di fronte
  const ip = reduce ? 1 : Math.min(1, t / INTRO_DUR), ie = 1 - Math.pow(1 - ip, 4);
  root.rotation.y = baseY + (1 - ie) * Math.PI * 2;
  // con il pannello aperto il logo si sposta nello spazio libero a destra
  const vs = viewSize();
  const targetX = drawer.open ? Math.min((drawer.edge / innerWidth) * vs.w * 0.5, vs.w * 0.5) : 0;
  root.position.x += (targetX - root.position.x) * 0.08;
  // e si rimpicciolisce per stare nello spazio rimasto
  const free = drawer.open ? Math.max(0.35, Math.min(1, (1 - drawer.edge / innerWidth) * 1.5)) : 1;
  root.scale.setScalar(root.scale.x + (free - root.scale.x) * 0.08);
  if (!reduce) inner.position.y = Math.sin(t * 0.8) * 0.04;

  ray.setFromCamera(pointer, camera);
  const h = drawer.open ? null : ray.intersectObjects(stars.map(s => s.hit), false)[0];
  const now = performance.now();
  hovered = h ? stars.find(s => s.hit === h.object) : null;
  if (hovered) hovered.until = now + 450;
  canvas.classList.toggle("hot", !!hovered && !dragging);
  stars.forEach(s => {
    const active = s === hovered || s.tagHover;
    s.s += ((active ? 1.28 : 1) - s.s) * 0.18; s.holder.scale.setScalar(s.s);
    const tw = reduce ? 0.7 : 0.55 + 0.45 * Math.max(0, Math.sin(t * 2.2 + s.phase));
    s.mat.emissiveIntensity = active ? 1.4 : 0.35 + tw * 0.9;
    s.glow.material.opacity = active ? 1 : 0.25 + tw * 0.6;
    s.glow.scale.setScalar(active ? 1.25 : 0.75 + tw * 0.3);
    s.mesh.rotation.z = reduce ? 0 : Math.sin(t * 1.3 + s.phase) * 0.12;
    if (s.tag) {
      const show = !drawer.open && (active || s.pinned || (s.until && now < s.until));
      s.holder.getWorldPosition(tmp); tmp.project(camera);
      const x = (tmp.x * 0.5 + 0.5) * innerWidth, y = (-tmp.y * 0.5 + 0.5) * innerHeight;
      let side = x < innerWidth / 2 ? "left" : "right";
      const tw = s.tag.offsetWidth || 260;
      if (side === "right" && x + 26 + tw > innerWidth - 8) side = "left";
      else if (side === "left" && x - 26 - tw < 8) side = "right";
      s.tag.dataset.side = side;
      s.tag.style.setProperty("--x", x + "px"); s.tag.style.setProperty("--y", y + "px");
      s.tag.classList.toggle("on", show);
      s.tag.tabIndex = show ? 0 : -1;
    }
  });
  // messaggio al centro del logo
  if (!hintDone) {
    if (drawer.open || t > HINT_FROM + HINT_FOR) endHint();
    else if (t > HINT_FROM) {
      root.getWorldPosition(tmp); tmp.project(camera);
      hintEl.style.setProperty("--x", ((tmp.x * 0.5 + 0.5) * innerWidth) + "px");
      hintEl.style.setProperty("--y", ((-tmp.y * 0.5 + 0.5) * innerHeight) + "px");
      hintEl.classList.add("on");
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
document.body.classList.add("has-3d");
frame();
</script>
