function renderCommands() {
  const ag = store.agent, A = AG[ag].A, D = CMDS[ag], cat = store.cmdcat || "sym";
  let body = "";
  if (cat === "sym") {
    body = `<div class="sym-grid">${D.sym.map(([g, t, d, ex]) => `<article class="sym-card"><span class="sym-g">${esc(g)}</span><div><h3>${t}</h3><p>${d}</p><pre class="sym-ex">${esc(ex)}</pre></div></article>`).join("")}</div>`;
  } else if (cat === "keys") {
    body = `<div class="key-list">${D.keys.map(([k, d]) => `<div class="key-row"><span class="key-k">${k.split(" ").map(x => `<kbd>${esc(x)}</kbd>`).join(" ")}</span><span>${d}</span></div>`).join("")}</div>
      ${ag === "claude" ? `<p class="lib-band" style="margin-top:24px">Le scorciatoie valgono quando usi ${A} nel Terminale. Nell'app desktop molte azioni hanno un pulsante dedicato e alcune scorciatoie possono cambiare.</p>` : ""}`;
  } else {
    body = D.cmd.map(([g, rows]) => `<section class="cmd-group"><h3 class="sc-sub">${g}</h3><div class="key-list">${rows.map(([c, d]) => `<div class="key-row"><code class="cmd-c">${c}</code><span>${d}</span></div>`).join("")}</div></section>`).join("")
      + `<p class="lib-band">Questi sono i comandi più utili per chi lavora con l'agente, non l'elenco completo. Scrivi <code>/help</code> (o solo <code>/</code>) per vedere tutti quelli della tua versione.</p>`;
  }
  app.innerHTML = `
    <div class="view-head"><button type="button" class="back" data-go="">${ICON_BACK} Tutte le sezioni</button></div>
    <div class="lib-intro fade-in">
      <h2>Comandi e <em>scorciatoie</em></h2>
      <p>I simboli, i tasti e i comandi per lavorare più veloce con ${A}. Cambia agente in alto per vedere quelli di ${ag === "claude" ? "Codex" : "Claude Code"}.</p>
    </div>
    <div class="filters" role="group" aria-label="Argomenti">${CMD_CATS.map(c => `<button type="button" data-cmdcat="${c.id}" aria-pressed="${c.id === cat}">${c.name}</button>`).join("")}</div>
    ${body}`;
  app.querySelectorAll("[data-cmdcat]").forEach(b => b.addEventListener("click", () => { store.cmdcat = b.dataset.cmdcat; save(); renderCommands(); }));
}

/* ---------- Library ---------- */
const libTab = {};
function skillPanel(x, i) {
  const ag = store.agent, A = AG[ag].A, tab = libTab[i] || "prompt";
  const tabs = [["prompt", A], ["term", "Terminale"], ["zip", "ZIP"]].filter(([k]) => !(k === "zip" && x.nozip)).map(([k, n]) =>
    `<button type="button" role="tab" data-tab="${i}:${k}" aria-selected="${tab === k}">${n}</button>`).join("");
  let body;
  if (tab === "zip") {
    body = `<div class="zip">
      <a class="btn primary" href="https://github.com/${x.src}/archive/HEAD.zip" target="_blank" rel="noopener">Scarica lo ZIP ↗</a>
      <p>Scompatta l'archivio e copia la cartella della skill (quella che contiene <code>SKILL.md</code>) in <code>${AG[ag].SK}</code>. Poi apri una nuova sessione di ${A}.</p>
    </div>`;
  } else {
    const isT = tab === "term";
    body = `<div class="block ${isT ? "term" : "prompt"}">
      <div class="bh"><span class="kind">${isT ? (store.os === "win" ? "PowerShell" : "Terminale") : `Prompt per ${A}`}</span><button type="button" class="copy" data-copy="${i}">Copia</button></div>
      <pre id="lib-${i}">${esc(isT ? skillTerm(x, ag) : skillPrompt(x, ag))}</pre>
    </div>`;
  }
  return `<div class="panel"><div class="tabs" role="tablist">${tabs}</div>${body}</div>`;
}
function renderLibrary() {
  const cat = store.cat || "all", A = AG[store.agent].A;
  const list = SKILLS.map((x, i) => [x, i]).filter(([x]) => cat === "all" || x.cat === cat);
  const catOf = id => CATS.find(c => c.id === id);
  app.innerHTML = `
    <div class="view-head"><button type="button" class="back" data-go="">${ICON_BACK} Tutte le sezioni</button></div>
    <div class="lib-intro fade-in">
      <h2>Una skill per <em>ogni mestiere</em></h2>
      <p>Per ogni skill hai tre strade: il prompt da dare a ${A} (consigliato), il comando da Terminale, oppure il file ZIP da scompattare a mano. Se è la tua prima skill, fai prima la sezione <a href="#skill">Installare una skill</a>.</p>
    </div>
    <div class="filters" role="group" aria-label="Categorie">
      ${CATS.map(c => `<button type="button" data-cat="${c.id}" aria-pressed="${c.id === cat}">${c.name}<span>${c.id === "all" ? SKILLS.length : SKILLS.filter(x => x.cat === c.id).length}</span></button>`).join("")}
    </div>
    ${cat === "adv" ? `<p class="lib-band">Per chi vuole andare oltre: strumenti che riducono il contesto sprecato e danno memoria all'agente nei progetti lunghi. Non servono per seguire il corso.</p>` : cat === "dev" ? `<p class="lib-band">Strumenti nati per chi sviluppa software: utili quando costruisci siti, tool o automazioni con l'agente.</p>` : ""}
    <div class="lib">
      ${list.map(([x, i]) => {
        const c = catOf(x.cat);
        return `<article class="skill">
          <div class="row"><span class="cat ${c.cls}">${c.name}</span></div>
          <h4>${x.name}</h4>
          <a class="src" href="https://github.com/${x.src}" target="_blank" rel="noopener">${x.src} ↗</a>
          <p>${x.d}</p>
          ${x.note ? `<p class="sk-note">${x.note}</p>` : ""}
          <div id="panel-${i}">${skillPanel(x, i)}</div>
        </article>`;
      }).join("")}
    </div>
    <p class="warn">Le skill della community sono codice scritto da terzi: prima di installarne una, apri il repository e leggi cosa fa. Il comando da Terminale usa <code>npx skills</code>, che richiede Node.js.</p>`;
  app.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => { store.cat = b.dataset.cat; save(); renderLibrary(); }));
  app.querySelector(".lib").addEventListener("click", e => {
    const t = e.target.closest("[data-tab]"); if (!t) return;
    const [i, k] = t.dataset.tab.split(":"); libTab[i] = k;
    const host = document.getElementById("panel-" + i);
    host.innerHTML = skillPanel(SKILLS[+i], +i);
    wireCopy(n => document.getElementById("lib-" + n), host);
  });
  wireCopy(n => document.getElementById("lib-" + n));
}

/* ---------- Copy ---------- */
function wireCopy(getPre, root) {
  (root || app).querySelectorAll(".copy").forEach(btn => btn.addEventListener("click", () => {
    const pre = getPre(btn.dataset.copy); if (!pre) return;
    const text = pre.textContent;
    const ok = () => { btn.classList.add("ok"); btn.innerHTML = ICON_CHECK + " Copiato"; setTimeout(() => { btn.classList.remove("ok"); btn.textContent = "Copia"; }, 1600); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = "Selezionato: premi Cmd+C";
      setTimeout(() => { btn.textContent = "Copia"; }, 2600);
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  }));
}

/* ---------- Router ---------- */
let view = (location.hash || "").replace("#", "");
if (view === "claude-code") view = "setup";
function route(focusTop) {
  const h = view;
  if (h === "library") renderLibrary();
  else if (h === "markdown") renderMarkdown();
  else if (h === "ui-refs") renderUiRefs();
  else if (h === "commands") renderCommands();
  else if (byId(h)) renderSection(h, focusTop);
  else renderHome();
  if (focusTop !== false) window.scrollTo({ top: 0 });
}
function go(to) {
  view = to; navDir = "";
  try { if (location.hash.replace("#", "") !== to) history.replaceState(null, "", to ? "#" + to : location.pathname + location.search); } catch (e) {}
  route();
  const head = app.querySelector("h1, h2");
  if (head) { head.setAttribute("tabindex", "-1"); head.focus({ preventScroll: true }); }
}
document.getElementById("skip").addEventListener("click", e => { e.preventDefault(); app.focus(); });
/* sigillo: ruota con lo scroll */
(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let tick = false;
  addEventListener("scroll", () => {
    if (tick) return; tick = true;
    requestAnimationFrame(() => { const s = document.querySelector(".seal svg"); if (s) s.style.setProperty("--rot", (scrollY * 0.25) + "deg"); tick = false; });
  }, { passive: true });
})();
app.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) {
    e.preventDefault();
    const to = g.dataset.go;
    if (byId(to)) { const p = prog(to); if (p.cur === -1 && doneCount(p) < byId(to).steps.length) p.cur = 0; }
    go(to); return;
  }
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); go(a.getAttribute("href").slice(1)); }
});
document.getElementById("home-link").addEventListener("click", e => { e.preventDefault(); go(""); });
window.addEventListener("hashchange", () => { view = location.hash.replace("#", ""); route(); });
function syncToggles() {
  document.querySelectorAll("[data-os]").forEach(x => x.setAttribute("aria-pressed", x.dataset.os === store.os));
  document.querySelectorAll("[data-ag]").forEach(x => x.setAttribute("aria-pressed", x.dataset.ag === store.agent));
}
document.querySelectorAll("[data-os]").forEach(b => b.addEventListener("click", () => { store.os = b.dataset.os; save(); syncToggles(); route(false); }));
document.querySelectorAll("[data-ag]").forEach(b => b.addEventListener("click", () => { store.agent = b.dataset.ag; save(); syncToggles(); route(false); }));
syncToggles();
route(false);
</script>
